pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// 让 Gradle 在缺少 JDK 25 时自动下载一个（MC 26.1+ 要求 Java 25）。
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

// Should match your modid
rootProject.name = 'inventorybutler'
