# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# MC 26.1 起 Minecraft 不再混淆，因此这里不再需要 yarn mappings，
# 且 Loom 的插件 id 由 `fabric-loom` 变为 `net.fabricmc.fabric-loom`。
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.19

# Mod Properties
version=1.0.2
group=com.inventorybutler
archives_base_name=inventorybutler

# Dependencies
fabric_api_version=0.160.0+26.2

# Minecraft 26.1+ 需要 Java 25。
# 若本机没有 JDK 25，settings.gradle 里的 foojay 解析器会自动下载一个。

# ---------------------------------------------------------------------------
# 国内镜像（可选；本机实测后默认关闭，原因见下）
# ---------------------------------------------------------------------------
# Loom 认这几个 gradle.properties 属性（见 loom 的 net.fabricmc.loom.util.MirrorUtil）：
#   loom_libraries_base        默认 https://libraries.minecraft.net/
#   loom_resources_base        默认 https://resources.download.minecraft.net/
#   loom_version_manifests     默认 https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
#   loom_experimental_versions 默认 https://maven.fabricmc.net/net/minecraft/experimental_versions.json
#   loom_fabric_repository     默认 https://maven.fabricmc.net/
#
# 本机（2026-09 实测）结论：**三个 Mojang 源都能直连，不需要镜像**，反而开了会坏：
#   - libraries.minecraft.net         131 个依赖全部 200、sha1 全对，大包约 2MB/s
#   - resources.download.minecraft.net 可直连（约 0.6s）
#   - piston-meta.mojang.com           可直连（约 0.5s）
# 而 bmclapi2 的 /maven/ 对 .jar 会 302 跳到 bmclapi2.sakura.sld.tw，
# 本机这条跳转会被链路改写成一个解析不了的主机，导致 patchy-2.2.10 这类包下载失败。
# 如果你所在网络确实连不上 libraries.minecraft.net，把下面这行取消注释即可：
# loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
