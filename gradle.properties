# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# MC 26.1 起 Minecraft 不再混淆，因此这里不再需要 yarn mappings，
# 且 Loom 的插件 id 由 `fabric-loom` 变为 `net.fabricmc.fabric-loom`。
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.19

# Mod Properties
version=1.0.0
group=com.example
archives_base_name=inventoryshortcuts

# Dependencies
fabric_api_version=0.160.0+26.2

# Minecraft 26.1+ 需要 Java 25。
# 若本机没有 JDK 25，settings.gradle 里的 foojay 解析器会自动下载一个。
